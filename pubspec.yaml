name: maktaba_ihsan
description: "Maktaba Ihsan - Free Madrasa Library Management System"
publish_to: 'none'
version: 1.0.3+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # â”€â”€ State Management â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  flutter_riverpod: ^2.5.1        # Reactive state management
  riverpod_annotation: ^2.3.5     # Code-gen annotations for Riverpod

  # â”€â”€ Local Database (Offline-First Core) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  sqflite: ^2.3.3+1               # Books, Users, Transactions
  sqflite_common_ffi: ^2.3.3      # Desktop (Windows/Linux) sqflite support
  path: ^1.9.0                    # File path utilities
  path_provider: ^2.1.3           # App document directory

  # â”€â”€ Hive (Teacher Notes, Routine, Settings) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  hive_flutter: ^1.1.0            # Hive with Flutter integration
  hive: ^2.2.3                    # Lightweight key-value NoSQL DB

  # â”€â”€ Networking (GAS Sync) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  dio: ^5.4.3+1                   # HTTP client with interceptors & retry
  http: ^1.2.2                    # Simple HTTP package (backup for GAS on web)
  connectivity_plus: ^6.0.3       # Detect online/offline status

  # â”€â”€ UI & Theming â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  google_fonts: any            # Arabic/Bengali/Urdu typography
  flex_color_scheme: any       # Premium theme generation
  flutter_animate: ^4.5.0         # Micro-animations
  cached_network_image: ^3.3.1    # Efficient image loading & caching
  shimmer: ^3.0.0                 # Loading skeleton effect

  # â”€â”€ Internationalization (Multi-Language) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  intl: any                   # Date formatting + i18n base

  # â”€â”€ Utils & Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  uuid: ^4.4.0                    # UUID generation for IDs (offline-safe)
  shared_preferences: ^2.2.3      # Simple key-value (last sync timestamp)
  equatable: ^2.0.5               # Value equality for models
  json_annotation: ^4.9.0         # JSON serialization annotations
  collection: ^1.18.0             # Dart collection utilities
  crypto: ^3.0.3                  # SHA-256 PIN hashing (UserRepository)

  # â”€â”€ File Operations (CSV Export) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  csv: ^6.0.0                     # CSV generation for DB export
  share_plus: ^9.0.0              # Share/export files
  permission_handler: ^11.3.1     # Storage permission for export

  # â”€â”€ Voice Typing (Teacher Notepad) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  speech_to_text: ^6.6.2          # Voice-to-text for notes
  sqflite_common_ffi_web: 0.4.1
  pdf: any
  printing: any
  url_launcher: ^6.3.1
  flutter_quill: ^10.8.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  supabase: ^2.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11           # Code generation runner
  riverpod_generator: ^2.4.0      # Riverpod code-gen
  hive_generator: ^2.0.1          # Hive TypeAdapter generator
  json_serializable: ^6.8.0       # JSON serialization code-gen
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo_light.png
    - assets/images/logo_dark.png
    - assets/images/calligraphy.png
    - assets/images/calligraphy_green.png

  fonts:
    - family: EkusheyBelycon
      fonts:
        - asset: assets/fonts/EkusheyBelycon.ttf
        - asset: assets/fonts/EkusheyBelycon.ttf
          weight: 700
    - family: UrduNastaleeq
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeq.ttf
        - asset: assets/fonts/JameelNooriNastaleeq.ttf
          weight: 600
        - asset: assets/fonts/JameelNooriNastaleeq.ttf
          weight: 700
    - family: ArabicMyLotus
      fonts:
        - asset: assets/fonts/mylotusRegular.ttf
        - asset: assets/fonts/mylotusRegular.ttf
          weight: 600
        - asset: assets/fonts/mylotusRegular.ttf
          weight: 700
    - family: ArabicUthmanic
      fonts:
        - asset: assets/fonts/KFGQPC_Uthmanic.otf
        - asset: assets/fonts/KFGQPC_Uthmanic.otf
          weight: 700
    - family: BengaliSolaiman
      fonts:
        - asset: assets/fonts/SolaimanLipi_22-02-2012.ttf
        - asset: assets/fonts/SolaimanLipi_22-02-2012.ttf
          weight: 600
        - asset: assets/fonts/SolaimanLipi_22-02-2012.ttf
          weight: 700
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
