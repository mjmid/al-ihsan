  <script>
    window.pwaDeferredPrompt = null;
    window.pwaIsInstalled = false;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.pwaDeferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-can-install'));
    });

    window.addEventListener('appinstalled', function() {
      window.pwaDeferredPrompt = null;
      window.pwaIsInstalled = true;
      try {
        localStorage.setItem('maktaba_pwa_installed', 'true');
      } catch(err) {}
      window.dispatchEvent(new CustomEvent('pwa-installed'));
    });

    function promptInstallPwa(callback) {
      if (window.pwaDeferredPrompt) {
        window.pwaDeferredPrompt.prompt();
        window.pwaDeferredPrompt.userChoice.then(function(choiceResult) {
          var accepted = (choiceResult.outcome === 'accepted');
          if (accepted) {
            try {
              localStorage.setItem('maktaba_pwa_installed', 'true');
            } catch(e) {}
          }
          window.pwaDeferredPrompt = null;
          if (callback) callback(accepted);
        }).catch(function(err) {
          if (callback) callback(false);
        });
      } else {
        if (callback) callback(false);
      }
    }

    function forceAppUpdateReload() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var registration of registrations) {
            registration.unregister();
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var name of names) {
                caches.delete(name);
              }
              window.location.reload(true);
            });
          } else {
            window.location.reload(true);
          }
        }).catch(function() {
          window.location.reload(true);
        });
      } else {
        window.location.reload(true);
      }
    }
  </script>
